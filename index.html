<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareTend to Salesforce: interactive demo</title>
<style>
:root{
  --bg:#EDF2F2; --surface:#FFFFFF; --ink:#10272F; --muted:#56707B; --line:#CFDCDE;
  --teal:#0F7F80; --on-teal:#FFFFFF; --teal-soft:#DDF0F0;
  --amber:#8A5300; --amber-soft:#FBE9C8; --coral:#B83A2E; --coral-soft:#F8DCD8;
  --green:#2E7D4B; --green-soft:#DAF0E2; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1A1F; --surface:#14262D; --ink:#E4EEF0; --muted:#8FA8B2; --line:#27404A;
    --teal:#4FC3C3; --on-teal:#08262A; --teal-soft:#16393D;
    --amber:#F0B35A; --amber-soft:#3A2D14; --coral:#F08A7E; --coral-soft:#3C1E1B;
    --green:#6FCB8E; --green-soft:#173424; color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:Cambria,"Iowan Old Style",Georgia,serif;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.top h1{font-size:22px}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.switchbox{display:flex;align-items:center;gap:12px}
.switchbox code{font-size:12px;color:var(--muted)}
.sw{position:relative;width:64px;height:32px;border-radius:16px;border:2px solid var(--line);background:var(--bg);padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--teal);border-color:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(32px);background:var(--on-teal)}
.app{display:grid;grid-template-columns:310px 1fr;gap:20px;max-width:1360px;margin:0 auto;padding:20px 24px 40px}
@media(max-width:900px){.app{grid-template-columns:1fr}}
.rail{align-self:start;position:sticky;top:12px}
@media(max-width:900px){.rail{position:static}}
.rail h2{font-size:17px;margin-bottom:10px}
.step{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.step b{display:block;font-size:14px}
.step span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.step[aria-current="true"]{background:var(--teal-soft);border-color:var(--teal)}
.step small{color:var(--muted)}
.reset{margin-top:6px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px}
.tab[aria-selected="true"]{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:14px}
.panel h2{font-size:19px;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:10px;padding:12px}
.stat b{display:block;font:700 28px Cambria,Georgia,serif}
.stat span{font-size:13px;color:var(--muted)}
.stat.bad b{color:var(--coral)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600}
tbody tr[data-open]{cursor:pointer}
tbody tr[data-open]:hover,tbody tr.sel{background:var(--teal-soft)}
.scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.tag.ok{background:var(--green-soft);color:var(--green)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--coral-soft);color:var(--coral)}
.tag.dim{background:var(--bg);color:var(--muted)}
.btn{background:var(--teal);color:var(--on-teal);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.fcard h3{font-size:16px}
.fcard p{margin:0;color:var(--muted);font-size:13px}
.fcard .btn{align-self:flex-start;margin-top:auto}
.result{margin-top:14px;border-radius:10px;padding:12px 14px;background:var(--teal-soft)}
.result ul{margin:6px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sect{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.sect h3{font-size:15px;margin-bottom:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pick{display:grid;gap:8px;margin-top:10px}
.pick button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;text-align:left}
.pick button:hover{border-color:var(--teal)}
textarea{width:100%;min-height:70px;font:13px/1.4 Consolas,"Courier New",monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
.note{font-size:13px;color:var(--muted)}

/* ===== Journey mode ===== */
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{font-family:inherit;letter-spacing:-.01em}
.modes{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px}
.mode{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.hide{display:none!important}
.story{max-width:1180px;margin:0 auto;padding:22px 24px 48px}
.hero h2{font-size:30px;margin-bottom:6px}
.hero p{margin:0;color:var(--muted);max-width:70ch;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;text-align:left;min-width:190px}
.chip b{display:block;font-size:15px}
.chip span{font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.track{position:relative;margin:30px 0 8px;padding-top:62px}
.rail-line{position:absolute;left:10%;right:10%;top:109px;height:6px;border-radius:3px;background:var(--line)}
.rail-fill{position:absolute;left:10%;top:109px;height:6px;border-radius:3px;background:var(--teal);transition:width .7s cubic-bezier(.3,.7,.2,1)}
.stops{display:grid;grid-template-columns:repeat(5,1fr);position:relative}
.stop{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 6px}
.dot{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line);color:var(--muted);transition:all .35s;position:relative;z-index:1}
.dot svg{width:34px;height:34px}
.stop b{margin-top:10px;font-size:15px}
.stop small{color:var(--muted);font-size:12.5px}
.stop[data-s="done"] .dot{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.stop[data-s="active"] .dot{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 7px var(--teal-soft)}
.stop[data-s="flag"] .dot{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 7px var(--amber-soft)}
.stop[data-s="fail"] .dot{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.stop[data-s="todo"]{opacity:.55}
.token{position:absolute;top:0;left:10%;transform:translateX(-50%);transition:left .7s cubic-bezier(.3,.7,.2,1);z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.rx{background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.rxtag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;white-space:nowrap}
.rxtag.dim{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.rxtag.ok{background:var(--teal);color:var(--on-teal)}
.rxtag.warn{background:var(--amber);color:var(--surface)}
.jgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:22px}
@media(max-width:900px){.jgrid{grid-template-columns:1fr}.stop b{font-size:13px}.dot{width:54px;height:54px}.rail-line,.rail-fill{top:98px}.chip{min-width:150px}}
.say{border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:22px}
.say h3{font-size:24px;margin-bottom:8px}
.say p{margin:0 0 10px;font-size:16px}
.say .tech{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:6px}
.say.flag{border-color:var(--amber);background:var(--amber-soft)}
.say.fail{border-color:var(--coral);background:var(--coral-soft)}
.fixbox{margin-top:12px;border-radius:12px;background:var(--surface);border:1px solid var(--amber);padding:14px}
.fixbox b{display:block;margin-bottom:6px}
.screen{border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.screen header{padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.screen .body{padding:16px;min-height:150px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.rxrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px;border-radius:10px;background:var(--teal-soft);animation:pop .4s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.progress{margin-left:auto;color:var(--muted);font-size:13px}
.btn.big{padding:11px 22px;font-size:16px;border-radius:12px}
.wrap-sandbox{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Full demo auto-play ===== */
#ap-play{background:var(--teal);color:var(--on-teal);border:0;border-radius:10px;padding:8px 14px;font-weight:700;display:flex;align-items:center;gap:8px}
#ap-play svg{width:14px;height:14px}
#player{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ink);color:var(--bg);display:none;align-items:center;gap:14px;padding:10px 18px 12px;box-shadow:0 -4px 18px rgba(0,0,0,.25)}
#player.on{display:flex;flex-wrap:wrap}
#player .pbtn{background:transparent;color:var(--bg);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;font-weight:600}
#player .pbtn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
#player .pbtn[aria-pressed="true"]{background:rgba(255,255,255,.18)}
#player .cap{flex:1 1 320px;min-width:200px;font-size:15px;line-height:1.35}
#player .cap small{display:block;color:rgba(255,255,255,.65);font-size:12px;margin-top:2px}
#player .bar{position:absolute;left:0;top:0;height:3px;background:rgba(255,255,255,.18);width:100%}
#player .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
#player.on ~ #toast{bottom:84px}
body.ap-on{padding-bottom:76px}
.spot{outline:3px solid var(--amber)!important;outline-offset:3px;border-radius:8px;animation:ap-pulse .8s ease-in-out 2}
@keyframes ap-pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,179,90,.0)}50%{box-shadow:0 0 0 10px rgba(240,179,90,.45)}}
@media (prefers-reduced-motion:reduce){.spot{animation:none}}
#aplog{display:none}
</style>

<body>
<header class="top">
  <div><h1>CareTend prescriptions in Salesforce</h1><p>Sample data only: names, NDCs and programs are test values.</p></div>
  <button id="ap-play" type="button" aria-label="Play the full demo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Play full demo</button>
  <div class="modes" role="group" aria-label="Demo mode"><button class="mode" id="m-story" aria-pressed="true">Patient journey</button><button class="mode" id="m-box" aria-pressed="false">Hands-on sandbox</button></div>
  <div class="switchbox hide" id="swbox"><code>PRO_Automation_Control.CareTend_Prescription</code><span id="swlabel"></span>
    <button class="sw" id="sw" role="switch" aria-checked="true" aria-label="CareTend prescription switch"></button></div>
</header>
<section class="story" id="story"><div id="j-root"></div></section>
<div class="app hide" id="sandbox">
  <aside class="rail"><h2>Demo script, 15 minutes</h2><div id="steps"></div><button class="reset" id="reset">Reset demo data</button></aside>
  <main><div class="tabs" role="tablist" id="tabs"></div><div id="view"></div></main>
</div>
<div id="player" role="region" aria-label="Demo player"><div class="bar"><i id="ap-bar"></i></div>
  <button class="pbtn primary" id="ap-toggle" type="button">Pause</button>
  <button class="pbtn" id="ap-speed" type="button" aria-pressed="false" title="Toggle speed">1x</button>
  <button class="pbtn" id="ap-stop" type="button">Stop</button>
  <div class="cap"><span id="ap-cap">Starting the demo…</span><small id="ap-sub"></small></div>
</div>
<pre id="aplog"></pre>
<div id="toast" role="status" aria-live="polite"></div>
<script>
//ENGINE-START
function normNdc(raw){
  const t=String(raw==null?'':raw).trim();
  if(!t) return {err:'NDC missing on prescription'};
  const bad={err:'NDC not recognised: '+t};
  if(!/^[0-9-]+$/.test(t)) return bad;
  if(t.indexOf('-')>=0){
    const p=t.split('-'); if(p.length!==3) return bad;
    const k=p.map(x=>x.length).join('-');
    if(k==='4-4-2') p[0]='0'+p[0];
    else if(k==='5-3-2') p[1]='0'+p[1];
    else if(k==='5-4-1') p[2]='0'+p[2];
    else if(k!=='5-4-2') return bad;
    return {key:p.join('')};
  }
  return t.length===11?{key:t}:bad;
}
function resolveProgram(programs,ndc){
  const n=normNdc(ndc); if(n.err) return {reason:n.err};
  const hits=programs.filter(p=>p.active&&String(p.ndcs||'').split(/[\n,]+/).some(x=>{const m=normNdc(x);return m.key===n.key;}));
  if(hits.length===1) return {program:hits[0]};
  if(hits.length===0) return {reason:'NDC not mapped to a program: '+String(ndc).trim()};
  return {reason:'NDC '+String(ndc).trim()+' is mapped to '+hits.length+' programs'};
}
function sameName(a,pt){return a.first.toLowerCase()===String(pt.first||'').toLowerCase()&&a.last.toLowerCase()===String(pt.last||'').toLowerCase();}
function matchPatient(accounts,row){
  const pt=row.pt;
  const byId=accounts.filter(a=>a.ctid&&a.ctid===pt.ctid);
  if(byId.length===1) return {acct:byId[0],method:'Auto - CareTend Patient Id'};
  if(!pt.first||!pt.last||!pt.dob) return {reason:'EHR Patient missing name or date of birth'};
  let c=accounts.filter(a=>a.dob===pt.dob&&sameName(a,pt));
  if(c.length===0) return {reason:'No patient with matching name and date of birth'};
  if(c.length>1&&row.program){const f=c.filter(a=>a.programs.indexOf(row.program)>=0); if(f.length===1) c=f;}
  if(c.length===1) return {acct:c[0],method:'Auto - Demographics'};
  return {reason:c.length+' patients match name and date of birth'};
}
function processRow(st,row){
  const reasons=[];
  const pr=resolveProgram(st.programs,row.ndc);
  if(pr.program) row.program=pr.program.id; else {row.program=null; reasons.push(pr.reason);}
  if(row.method==='Manual'){ /* never overwritten */ }
  else{
    const m=matchPatient(st.accounts,row);
    if(m.acct){row.acct=m.acct.id;row.method=m.method;} else {row.acct=null;row.method='Unmatched';reasons.push(m.reason);}
  }
  row.reason=reasons.join('; ').slice(0,255);
  row.review=!!row.reason;
  afterSave(st,row);
}
function afterSave(st,row){
  if(!row.acct||!row.pt.ctid) return;
  const a=st.accounts.find(x=>x.id===row.acct);
  if(a&&!a.ctid&&!st.accounts.some(x=>x.ctid===row.pt.ctid)){a.ctid=row.pt.ctid;row.learned=true;}
}
function landRow(st,row){ // as MuleSoft sends it
  row.program=null;row.acct=null;row.method='';row.review=true;row.reason='';
  if(st.on) processRow(st,row);
}
//ENGINE-END

const PROG_NAME_UNKNOWN='Unknown Program';
const FEED={
  daniel1:{title:'Daniel, RX-E2E-1',note:'NDC 72990-103-10. Patient Daniel CareTendTest, born 1980-04-15.',row:{rx:'RX-E2E-1',med:'Sample medication A',ndc:'72990-103-10',strength:'50 mg',route:'Oral',freq:'Twice daily',status:'Active',pt:{first:'Daniel',last:'CareTendTest',dob:'1980-04-15',ctid:'CT-77120'}}},
  daniel2:{title:'Daniel, RX-E2E-2',note:'NDC 55555-5555-55, which no program lists yet.',row:{rx:'RX-E2E-2',med:'Sample medication B',ndc:'55555-5555-55',strength:'10 mg',route:'Oral',freq:'Once daily',status:'Active',pt:{first:'Daniel',last:'CareTendTest',dob:'1980-04-15',ctid:'CT-77120'}}},
  twin:{title:'Twin, RX-TWIN-1',note:'Two people share this name and birth date. NDC 72990-103-10.',row:{rx:'RX-TWIN-1',med:'Sample medication A',ndc:'72990-103-10',strength:'50 mg',route:'Oral',freq:'Twice daily',status:'Active',pt:{first:'Twin',last:'CareTendTest',dob:'1990-06-02',ctid:'CT-88231'}}},
  nobody:{title:'Nora, RX-NOPT-1',note:'A patient who does not exist in Salesforce.',row:{rx:'RX-NOPT-1',med:'Sample medication A',ndc:'72990-103-10',strength:'50 mg',route:'Oral',freq:'Once daily',status:'Active',pt:{first:'Nora',last:'Unlisted',dob:'1975-01-30',ctid:'CT-99001'}}},
  bare:{title:'Daniel, RX-BARE-1',note:'NDC sent as ten bare digits: 7299010310.',row:{rx:'RX-BARE-1',med:'Sample medication A',ndc:'7299010310',strength:'50 mg',route:'Oral',freq:'Once daily',status:'Active',pt:{first:'Daniel',last:'CareTendTest',dob:'1980-04-15',ctid:'CT-77120'}}}
};
const STEPS=[
 {t:'1. Today\'s problem',m:'2 min',d:'Open All prescriptions. Every legacy row has no program, no patient, Requires Review ticked and no reason.',tab:'all'},
 {t:'2. A good day',m:'3 min',d:'Send Daniel\'s RX-E2E-1. Open it, then open Daniel on Patients to see the learned CareTend id.',tab:'feed'},
 {t:'3. Something it could not do',m:'3 min',d:'Send RX-E2E-2. Open it in CareTend Review, add its NDC to Fennec Hears on Programs, then press Reprocess.',tab:'feed'},
 {t:'4. Two look-alike patients',m:'3 min',d:'Send the Twin row. Open it in CareTend Review and press Match Patient.',tab:'feed'},
 {t:'5. Guard rails',m:'2 min',d:'Turn the switch OFF and send a row: it lands untouched. Turn it ON again.',tab:'feed'},
 {t:'6. What is left',m:'2 min',d:'Roles, review owner, Beren NDCs, UAT feed, MuleSoft changes.',tab:'left'}
];
const TABS=[['feed','CareTend feed'],['review','CareTend Review'],['all','All prescriptions'],['patients','Patients'],['programs','Programs'],['left','What is left']];

let S;
function fresh(){
  const legacy=[];
  for(let i=0;i<33;i++) legacy.push({id:'L'+i,legacy:true,rx:'500052'+String(100+i),med:'(not sent)',ndc:'',strength:'',route:'',freq:'',status:i%3?'Active':'Completed',pt:{first:'',last:'',dob:'',ctid:''},program:null,fixedProgram:i<2?'Fennec Hears':null,acct:null,method:'',review:true,reason:''});
  return {
    on:true,tab:'all',step:0,sel:null,patient:'A1',picking:false,last:null,
    programs:[
      {id:'P1',name:'Fennec Hears',ndcs:'72990-103-10',active:true},

function send(key){
  const f=FEED[key].row, ex=S.rows.find(r=>r.rx===f.rx);

  if(!ex){row=Object.assign({id:'R'+S.rows.length+Date.now(),legacy:false,manual:false},JSON.parse(JSON.stringify(f)));S.rows.unshift(row);landRow(S,row);}
  else {Object.assign(row,JSON.parse(JSON.stringify(f)));if(S.on) processRow(S,row); }
  S.sel=row.id;

    msgs.push(pn?'Filed under '+pn+'.':'Not filed: '+row.reason.split('; ')[0]+'.');
    msgs.push(a?'Patient found: '+a.first+' '+a.last+' ('+row.method+').':'No patient linked.');
    if(row.learned){msgs.push('CareTend patient id '+row.pt.ctid+' written onto the Account.');row.learned=false;}

  if(b.id==='sw'){S.on=!S.on;toast('Switch '+(S.on?'ON: new rows are filed and matched':'OFF: rows land exactly as sent'));render();return;}

  if(b.dataset.send) return send(b.dataset.send);
  if(b.dataset.tab){S.tab=b.dataset.tab;S.picking=false;return render();}

    processRow(S,r);toast(r.review?'Still needs review: '+r.reason:'Still needs review: false. Row is filed and linked.');return render();
  }
  if(b.dataset.pick&&r){
    const a=S.accounts.find(x=>x.id===b.dataset.pick);
    r.acct=a.id;r.method='Manual';
    const pr=resolveProgram(S.programs,r.ndc); r.program=pr.program?pr.program.id:null;

});

  const done=i===4;
  const next=blocked?'<button class="btn big" disabled>Fix it to continue</button>':(done?'<button class="btn big" data-jnav="replay">Replay this journey</button>':'<button class="btn big" data-jnav="next">Next step</button>');
  const endNote=done?(SCN[J.scn].on?'<div class="sect"><b>Try another journey</b><br><span class="note">Pick a different scenario above, or switch to the hands-on sandbox to send your own prescriptions.</span></div>':'<div class="sect"><b>This is production today</b><br><span class="note">Same prescription, no result for Sophie. Compare it with the same journey on a good day.</span><div class="actions"><button class="btn" data-scn="good">Switch on and replay</button></div></div>'):'';
  $('#j-root').innerHTML=
   '<div class="hero"><h2>Follow one prescription from the pharmacy to the care team</h2><p>Daniel\'s prescription takes five stops. Pick a scenario and step through it. Amber means Salesforce needs a person, red means the stop failed.</p></div>'+
   '<div class="chips" role="group" aria-label="Scenario">'+Object.keys(SCN).map(k=>'<button class="chip" data-scn="'+k+'" aria-pressed="'+(k===J.scn)+'"><b>'+esc(SCN[k].label)+'</b><span>'+esc(SCN[k].blurb)+'</span></button>').join('')+'</div>'+
   '<div class="track"><div class="token" style="left:'+pos+'"><span class="rx">Rx · '+esc(r.pt.first)+' · '+esc(r.rx)+'</span>'+tag+'</div><div class="rail-line"></div><div class="rail-fill" style="width:'+(i*20)+'%;max-width:80%"></div>'+
   '<div class="stops">'+STOPS.map((s,k)=>'<div class="stop" data-s="'+stopState(k)+'"><div class="dot">'+dotIcon(k)+'</div><b>'+esc(s.t)+'</b><small>'+esc(s.w)+'</small></div>').join('')+'</div></div>'+
   '<div class="jgrid"><div><div class="say '+jvariant(i,stg)+'"><h3>'+esc(t.h)+'</h3><p>'+esc(t.p)+'</p>'+fixed+'<div class="tech"><b>In system terms:</b> '+esc(t.tech)+'</div></div>'+fix+endNote+'</div>'+
   '<div class="screen"><header><span>Salesforce · '+esc(r.pt.first+' '+r.pt.last)+'</span><span>Prescriptions (CareTend)</span></header><div class="body"><div class="who"><div class="avatar">S</div><div><b>Sophie, case manager</b><br><span class="note">Looking at '+esc(r.pt.first)+'\'s patient page</span></div></div>'+screenBody+'</div></div></div>'+
   '<div class="controls"><button class="btn alt" data-jnav="back"'+(i===0?' disabled':'')+'>Back</button>'+next+'<button class="btn alt" data-jnav="auto" aria-pressed="'+(!!J.auto)+'">'+(J.auto?'Pause auto-play':'Auto-play')+'</button><span class="progress">Stop '+(i+1)+' of 5</span></div>';
}
function jstop(){if(J.auto){clearInterval(J.auto);J.auto=null;}}
function jstart(scn){jstop();J={scn:scn,i:0,fix:{},auto:null,st:null,row:null};jrun();jrender();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-scn],[data-jnav],[data-jfix],#m-story,#m-box'); if(!b) return;
  if(b.id==='m-story'||b.id==='m-box'){
    const story=b.id==='m-story'; jstop();
    $('#story').classList.toggle('hide',!story);$('#sandbox').classList.toggle('hide',story);$('#swbox').classList.toggle('hide',story);
    $('#m-story').setAttribute('aria-pressed',story);$('#m-box').setAttribute('aria-pressed',!story);return;
  }
  if(b.dataset.scn) return jstart(b.dataset.scn);
  if(b.dataset.jfix){
    const v=b.dataset.jfix; if(v==='ndc') J.fix.ndc=true; else J.fix.twin=v.split(':')[1];
    jrun();jrender();toast('Fixed. Reprocessed with the new information.');return;
  }
  const n=b.dataset.jnav, stg=jstages();
  if(n==='next'&&J.i<4&&stg[J.i]!=='flag'){J.i++;jrender();}
  else if(n==='back'&&J.i>0){jstop();J.i--;jrender();}
  else if(n==='replay'){jstart(J.scn);}
  else if(n==='auto'){
    if(J.auto){jstop();jrender();}
    else{J.auto=setInterval(()=>{const g=jstages();
      if(g[J.i]==='flag'){const f=document.querySelector('[data-jfix]');if(f){apClick(f.getAttribute('data-jfix')==='ndc'?'[data-jfix="ndc"]':'[data-jfix="'+f.getAttribute('data-jfix')+'"]');}else{jstop();jrender();}}
      else if(J.i<4){J.i++;jrender();}
      else{jstop();jrender();}
    },2600/(AP.on?AP.speed:1));jrender();}
  }
});
jstart('good');

/* ===== Full demo auto-play (director) ===== */
const AP={on:false,paused:false,speed:1,i:0,timer:null,synthetic:false,steps:[],hit:new Set()};
const APQ=new URLSearchParams(location.search);
function apLog(m){const el=$('#aplog');if(el){el.textContent+=m+'\n';}}
function apSpot(el){if(!el)return;document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot'));el.classList.add('spot');try{el.scrollIntoView({block:'center',behavior:AP.speed>4?'auto':'smooth'});}catch(e){}}
function apClick(sel){const el=typeof sel==='string'?document.querySelector(sel):sel;if(!el){apLog('MISSING '+sel);return false;}AP.hit.add(typeof sel==='string'?sel:'#'+el.id);apSpot(el);AP.synthetic=true;try{el.click();}finally{AP.synthetic=false;}return true;}
function apStep(cap,run,ms,sub){return {cap,run,ms:ms||2600,sub:sub||''};}
function apJourney(k,opt){
  opt=opt||{};const s=[];const lbl=SCN[k].label;
  s.push(apStep("Patient journey: "+lbl,()=>apClick('[data-scn="'+k+'"]'),2600,SCN[k].blurb));
  if(opt.auto){
    s.push(apStep("Journey Auto-play button",()=>apClick('[data-jnav="auto"]'),2600*6+800,"The journey plays itself: one stop every 2.6 seconds. On an amber stop Priya applies the fix and it continues."));
    s.push(apStep(()=>jtext(J.i,jstages()).h,()=>{if(J.auto){jstop();jrender();}return J.i===4?undefined:"skip";},2200,()=>jtext(J.i,jstages()).tech));
  }else{
    for(let n=0;n<7;n++){
      s.push(apStep(()=>jtext(J.i,jstages()).h,()=>{
        const stg=jstages();
        if(stg[J.i]==="flag"){
          const f=J.i===2?'[data-jfix="ndc"]':'[data-jfix="twin:A2"]';
          apClick(f);return J.i===2?"Priya adds NDC 55555-5555-55 to Fennec Hears and presses Reprocess.":"Priya picks Twin CareTendTest from Dayton. Manual matches are never overridden.";
        }
        if(J.i<4){apClick('[data-jnav="next"]');return;}
        return "skip";
      },2800,()=>jtext(J.i,jstages()).tech));
    }
  }
  if(opt.back){
    s.push(apStep("Back one stop",()=>apClick('[data-jnav="back"]'),2400,"Back and Next step let a presenter linger on any stop."));
    s.push(apStep(()=>jtext(J.i,jstages()).h,()=>apClick('[data-jnav="next"]'),2400,()=>jtext(J.i,jstages()).tech));
  }
  s.push(apStep("End of "+lbl,()=>{},1800,SCN[k].on?"Sophie, the case manager, sees the prescription on the patient page.":"Production today: Sophie sees nothing."));
  if(opt.replay){
    s.push(apStep("Replay this journey",()=>apClick('[data-jnav="replay"]'),2400,"Replay starts the same scenario again from the pharmacy."));
  }
  if(opt.switchOn){
    s.push(apStep("Switch on and replay",()=>apClick('.sect [data-scn="good"]'),2600,"The before-and-after comparison: same prescription, new build, Sophie sees it."));
    for(let n=0;n<4;n++) s.push(apStep(()=>jtext(J.i,jstages()).h,()=>{if(J.i<4){apClick('[data-jnav="next"]');return;}return "skip";},1600,()=>jtext(J.i,jstages()).tech));
  }
  return s;
}
function apSandbox(){
  const s=[];const NL=String.fromCharCode(10);
  const rowId=rx=>{const r=S.rows.find(x=>x.rx===rx);return r?r.id:null;};
  const openRx=rx=>{const id=rowId(rx);return id?apClick('tr[data-open="'+id+'"]'):false;};
  s.push(apStep("Hands-on sandbox",()=>apClick("#m-box"),2400,"The same engine, driven by hand. Left: the six-step script. Right: the tabs an Ops user would work in."));
  // Step 1
  s.push(apStep("Step 1. Today's problem",()=>apClick('[data-step="0"]'),3200,"All prescriptions: 33 legacy rows, no program, no patient, Requires Review ticked and no reason."));
  s.push(apStep("Open a legacy row",()=>apClick('#view tr[data-open]'),3000,"EHR Medication Prescription with nothing sent: NDC missing, Unknown Program, no patient. Match Patient is disabled for legacy rows."));
  s.push(apStep("Review tab is empty",()=>apClick('[data-tab="review"]'),2400,"Review lists only rows the new build flagged. Legacy rows never appear here."));
  // Step 2
  s.push(apStep("Step 2. A good day",()=>apClick('[data-step="1"]'),1800,"CareTend feed: each button plays what MuleSoft does every 30 minutes."));
  s.push(apStep("MuleSoft lands RX-E2E-1",()=>apClick('[data-send="daniel1"]'),3000,"Filed under Fennec Hears, patient found by demographics, CareTend id learned."));
  s.push(apStep("Open the row",()=>apClick("[data-open-last]"),3000,"Program, patient, match method and the CareTend patient id on one record."));
  s.push(apStep("Daniel's patient page",()=>{apClick('[data-tab="patients"]');apClick('[data-patient="A1"]');},3400,"The Account now carries CareTend id CT-77120 and lists the prescription."));
  s.push(apStep("Same prescription sent again",()=>{apClick('[data-tab="feed"]');apClick('[data-send="daniel1"]');},3000,"Re-sent RX-E2E-1: same prescription id, so it updates the same row. No duplicates."));
  // Step 3
  s.push(apStep("Step 3. Something it could not do",()=>apClick('[data-step="2"]'),1800,"Send RX-E2E-2 with an NDC no program lists."));
  s.push(apStep("MuleSoft lands RX-E2E-2",()=>apClick('[data-send="daniel2"]'),3000,"Not filed: NDC not mapped to a program. Patient found by CareTend id."));
  s.push(apStep("CareTend Review shows the reason",()=>apClick("[data-open-last]"),3000,"Rows Salesforce could not place, each with a reason. Review count is shown on the tab."));
  s.push(apStep("Programs tab",()=>apClick('[data-tab="programs"]'),2600,"Ops maintain the NDC list on each Program: Fennec Hears, DefenCath, Invivyd."));
  s.push(apStep("Add the NDC to Fennec Hears",()=>{const ta=document.getElementById("n-P1");if(ta){ta.value=ta.value.trim()+NL+"55555-5555-55";apSpot(ta);}},2600,"Any printed NDC format works, one per line."));
  s.push(apStep("Save program",()=>apClick('[data-save="P1"]'),2200,"Program saved. Now Reprocess the flagged row."));
  s.push(apStep("Reprocess RX-E2E-2",()=>{apClick('[data-tab="review"]');openRx("RX-E2E-2");apClick('[data-act="reprocess"]');},3400,"Filed under Fennec Hears. Requires review cleared, row leaves the Review list."));
  // Step 4
  s.push(apStep("Step 4. Two look-alike patients",()=>apClick('[data-step="3"]'),1800,"Send the Twin row."));
  s.push(apStep("MuleSoft lands RX-TWIN-1",()=>apClick('[data-send="twin"]'),3000,"Filed under Fennec Hears, but two patients share name and birth date."));
  s.push(apStep("Match Patient",()=>{apClick("[data-open-last]");apClick('[data-act="pick"]');},3000,"A coordinator chooses. Salesforce never guesses between two people."));
  s.push(apStep("Pick Twin CareTendTest, Dayton",()=>apClick('[data-pick="A2"]'),3000,"Match method Manual. The CareTend id is learned on that Account."));
  s.push(apStep("Twin from Dayton",()=>{apClick('[data-tab="patients"]');apClick('[data-patient="A2"]');},3000,"CareTend id CT-88231 learned, prescription listed."));
  s.push(apStep("Twin from Toledo",()=>apClick('[data-patient="A3"]'),2600,"Untouched: no CareTend id, no prescriptions. Nothing leaked to the wrong twin."));
  // Extra scenarios
  s.push(apStep("A patient who does not exist",()=>{apClick('[data-tab="feed"]');apClick('[data-send="nobody"]');},3000,"RX-NOPT-1: filed under Fennec Hears, but no patient with that name and birth date."));
  s.push(apStep("Match Patient chooser",()=>{apClick("[data-open-last]");apClick('[data-act="pick"]');},2800,"Every patient is offered. Nora is not one of them, so the coordinator closes the chooser and the row stays in Review."));
  s.push(apStep("Close the chooser",()=>apClick('[data-act="pick"]'),1800,"The row waits in Review until the patient is created or the prescription is corrected."));
  // Step 5
  s.push(apStep("Step 5. Guard rails",()=>apClick('[data-step="4"]'),1800,"Turn the switch OFF and send a row."));
  s.push(apStep("Switch OFF",()=>apClick("#sw"),2200,"PRO_Automation_Control.CareTend_Prescription = OFF"));
  s.push(apStep("MuleSoft lands RX-BARE-1",()=>apClick('[data-send="bare"]'),3000,"With the switch OFF the row lands exactly as sent: Unknown Program, no patient, Requires Review, no reason."));
  s.push(apStep("Reprocess while OFF",()=>{apClick("[data-open-last]");apClick('[data-act="reprocess"]');},2600,"Reprocess changes nothing while the switch is OFF."));
  s.push(apStep("Switch ON again",()=>apClick("#sw"),2000,"Back to normal operation."));
  s.push(apStep("Reprocess RX-BARE-1",()=>apClick('[data-act="reprocess"]'),3000,"Now processed: NDC 7299010310 has ten bare digits, so it is not recognised. Patient still found by CareTend id. Stays in Review with the reason."));
  s.push(apStep("Review list",()=>apClick('[data-tab="review"]'),2800,"Two rows waiting: RX-NOPT-1 (no patient) and RX-BARE-1 (NDC not recognised)."));
  s.push(apStep("All prescriptions",()=>apClick('[data-tab="all"]'),2800,"Counters drop as rows are filed and matched. Legacy rows stay as they are."));
  // Step 6
  s.push(apStep("Step 6. What is left before switch-on",()=>apClick('[data-step="5"]'),5000,"Roles, review owner, Beren NDCs, UAT feed, MuleSoft changes."));
  s.push(apStep("Reset demo data",()=>{apSummary();apClick("#reset");},2600,"Reset returns the sandbox to the 33 legacy rows."));
  s.push(apStep("Back to the patient journey",()=>apClick("#m-story"),2000,"Both modes are always one click away."));
  s.push(apStep("Demo complete",()=>{},4000,"Press Replay to run it again, or use any button to explore by hand."));
  return s;
}
function apSummary(){
  const filed=S.rows.filter(r=>!r.legacy&&!r.review).length, rev=S.rows.filter(r=>!r.legacy&&r.review).length;
  const ids=S.accounts.map(a=>a.first+" "+a.city+": "+(a.ctid||"none")).join(", ");
  apLog("SUMMARY filed="+filed+" review="+rev+" switch="+S.on+" ids="+ids);
}
function apBuild(){AP.hit=new Set();AP.steps=[].concat(apJourney('good',{back:true,replay:true}),apJourney('ndc',{auto:true}),apJourney('twin',{}),apJourney('before',{switchOn:true}),apSandbox());}
function apText(v){return typeof v==='function'?v():v;}
function apShow(step){const c=apText(step.cap),sub=apText(step.sub);$('#ap-cap').textContent=c;$('#ap-sub').textContent=sub||'';$('#ap-bar').style.width=Math.round(100*AP.i/AP.steps.length)+'%';}
function apSchedule(ms){clearTimeout(AP.timer);AP.timer=setTimeout(apTick,Math.max(60,ms/AP.speed));}
function apTick(){
  if(!AP.on||AP.paused)return;
  if(AP.i>=AP.steps.length){apFinish();return;}
  const step=AP.steps[AP.i];
  let extra;
  try{extra=step.run();}catch(e){apLog('ERROR step '+AP.i+' '+(e&&e.message));}
  if(extra==='skip'){AP.i++;apTick();return;}
  apShow(step);
  if(typeof extra==='string'){$('#ap-sub').textContent=extra;}
  apLog('STEP '+AP.i+' '+apText(step.cap));
  AP.i++;
  apSchedule(step.ms);
}
function apStart(){
  if(AP.on){apStop();}
  jstop();S=fresh();render();
  if($('#story').classList.contains('hide')){apClick('#m-story');}
  apBuild();AP.on=true;AP.paused=false;AP.i=0;
  document.body.classList.add('ap-on');$('#player').classList.add('on');$('#ap-toggle').textContent='Pause';$('#ap-play').textContent='Restart demo';
  apLog('START speed='+AP.speed);
  apTick();
}
function apPause(why){if(!AP.on||AP.paused)return;AP.paused=true;clearTimeout(AP.timer);$('#ap-toggle').textContent='Resume';if(why){$('#ap-sub').textContent=why;}}
function apResume(){if(!AP.on||!AP.paused)return;AP.paused=false;$('#ap-toggle').textContent='Pause';apTick();}
function apStop(){AP.on=false;AP.paused=false;clearTimeout(AP.timer);document.body.classList.remove('ap-on');$('#player').classList.remove('on');document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot'));$('#ap-play').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>Play full demo';}
function apFinish(){AP.on=false;clearTimeout(AP.timer);$('#ap-bar').style.width='100%';$('#ap-toggle').textContent='Replay';$('#ap-cap').textContent='Demo complete';apLog('HIT '+Array.from(AP.hit).sort().join(' | '));apLog('COMPLETE');}
document.addEventListener('click',e=>{
  const t=e.target.closest('#ap-play,#ap-toggle,#ap-speed,#ap-stop');
  if(t){
    if(t.id==='ap-play'){apStart();}
    else if(t.id==='ap-toggle'){if(!AP.on){apStart();}else if(AP.paused){apResume();}else{apPause();}}
    else if(t.id==='ap-speed'){AP.speed=AP.speed===1?2:1;t.textContent=AP.speed+'x';t.setAttribute('aria-pressed',AP.speed===2);}
    else if(t.id==='ap-stop'){apStop();}
    return;
  }
  if(AP.on&&!AP.paused&&!AP.synthetic&&e.isTrusted){apPause('Paused because you clicked. Press Resume to continue.');}
},true);
document.addEventListener('keydown',e=>{if(e.key===' '&&AP.on&&!e.target.matches('input,textarea,button')){e.preventDefault();AP.paused?apResume():apPause();}});
if(APQ.get('autoplay')==='1'){AP.speed=+(APQ.get('speed')||1)||1;$('#ap-speed').textContent=AP.speed+'x';setTimeout(apStart,200);}


</script>
